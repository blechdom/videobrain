name: Verify and deploy VideoBrain to AWS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: videobrain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify and build application
        run: npm run verify
      - name: Build public artifact and component catalog
        run: npm run build:deploy
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:e2e
      - name: Verify deployable artifact
        run: |
          test -f dist/index.html
          test -f dist/storybook/index.html
          test -f dist/storybook/iframe.html
          test -f dist/storybook/index.json
          npm run check:storybook-dist
      - uses: actions/upload-artifact@v7
        with:
          name: videobrain-site
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.AWS_ACCOUNT_ID != '' &&
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      vars.AWS_SITE_BUCKET != '' &&
      vars.AWS_CLOUDFRONT_DISTRIBUTION_ID != ''
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://videobrain.org
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: videobrain-site
          path: site
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: videobrain-${{ github.run_id }}
      - name: Verify CloudFront is ready for Storybook
        run: |
          root_headers="$(mktemp)"
          storybook_headers="$(mktemp)"
          trap 'rm -f "$root_headers" "$storybook_headers"' EXIT

          curl --fail --silent --show-error --head \
            --retry 4 --retry-all-errors --retry-delay 2 \
            https://videobrain.org/ >"$root_headers"

          # The probe object is intentionally absent before the first catalog
          # upload. Its response still has to use the scoped framing policy.
          curl --silent --show-error --head \
            --retry 4 --retry-all-errors --retry-delay 2 \
            https://videobrain.org/storybook/__cloudfront-policy-probe__ \
            >"$storybook_headers"

          grep -iE "^x-frame-options:[[:space:]]*DENY[[:space:]]*$" "$root_headers"
          grep -iE "^x-frame-options:[[:space:]]*SAMEORIGIN[[:space:]]*$" "$storybook_headers"
          grep -iE "^content-security-policy:[[:space:]]*frame-ancestors[[:space:]]+'self'[[:space:]]*$" \
            "$storybook_headers"
      - name: Publish static files
        run: |
          aws s3 sync site/ "s3://${{ vars.AWS_SITE_BUCKET }}/" \
            --exclude "*.html" \
            --only-show-errors \
            --cache-control "public,max-age=300,must-revalidate"
          aws s3 cp site/ "s3://${{ vars.AWS_SITE_BUCKET }}/" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --only-show-errors \
            --cache-control "public,max-age=0,must-revalidate"
      - name: Invalidate CloudFront
        id: invalidation
        run: |
          invalidation_id="$(
            aws cloudfront create-invalidation \
              --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
              --paths "/*" \
              --query "Invalidation.Id" \
              --output text
          )"
          echo "id=$invalidation_id" >> "$GITHUB_OUTPUT"
      - name: Wait for publication
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "${{ steps.invalidation.outputs.id }}"
      - name: Smoke-test production
        run: |
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            https://videobrain.org/ >/dev/null
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            https://videobrain.org/storybook/ >/dev/null
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            https://videobrain.org/storybook/iframe.html >/dev/null
          curl --fail --silent --show-error \
            --retry 8 --retry-all-errors --retry-delay 5 \
            https://videobrain.org/storybook/index.json >/dev/null
          curl --fail --silent --show-error --head \
            --retry 8 --retry-all-errors --retry-delay 5 \
            https://videobrain.org/ \
            | grep -iE "^content-type:.*text/html"
          curl --fail --silent --show-error --head \
            --retry 8 --retry-all-errors --retry-delay 5 \
            https://videobrain.org/ \
            | grep -iE "^x-frame-options:[[:space:]]*DENY"
          curl --fail --silent --show-error --head \
            --retry 8 --retry-all-errors --retry-delay 5 \
            https://videobrain.org/storybook/ \
            | grep -iE "^x-frame-options:[[:space:]]*SAMEORIGIN"
          curl --fail --silent --show-error --head \
            --retry 8 --retry-all-errors --retry-delay 5 \
            https://videobrain.org/storybook/ \
            | grep -iE "^content-security-policy:.*frame-ancestors[[:space:]]+'self'"
          curl --fail --silent --show-error --head \
            --retry 8 --retry-all-errors --retry-delay 5 \
            https://www.videobrain.org/ \
            | grep -iE "^location:[[:space:]]*https://videobrain.org/"
